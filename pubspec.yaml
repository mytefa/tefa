name: myteachingfactory
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  file_picker: ^8.0.0
  permission_handler: ^12.0.1
  confetti: ^0.8.0
  flutter_svg: ^2.0.10+1
  youtube_player_flutter: ^9.0.1
  url_launcher: ^6.2.5
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/elements/
    - assets/iconapp.png


# Konfigurasi untuk membuat launcher icon
flutter_launcher_icons:
  android: "launcher_icon"   # Mengaktifkan untuk Android
  ios: true                  # Mengaktifkan untuk iOS
  image_path: "assets/ico.png" # Path ke file ikon Anda
  min_sdk_android: 21          # (Opsional) pastikan sesuai minSDK project Anda


